server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 安全响应头（location 内若使用 add_header 会覆盖这里的配置，故统一用 expires 控制缓存）
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # gzip 压缩
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 带 contenthash 的构建产物，长期缓存
    location /static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        expires -1;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
